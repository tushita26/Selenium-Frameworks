# ExtentReports Configuration Properties
# Report theme: standard, dark
extent.reporter.spark.config.theme=dark

# Report title
extent.reporter.spark.config.documentTitle=ParaBank Automation Test Report

# Report name
extent.reporter.spark.config.reportName=ParaBank Test Suite

# Encoding
extent.reporter.spark.config.encoding=UTF-8

# Timeline enabled
extent.reporter.spark.config.timeline.enabled=true

# Screenshots on base64
extent.reporter.spark.config.screenshot.rel.path=../screenshots/

# System info
extent.reporter.spark.config.systeminfo.os=OS
extent.reporter.spark.config.systeminfo.javaversion=Java Version
extent.reporter.spark.config.systeminfo.browser=Browser

# Custom CSS if needed
# extent.reporter.spark.config.css=css/custom.css

extent.reporter.spark.out=target/SparkReport.html
extent.reporter.spark.config=extent-config.xml
extent.reporter.spark.config=spark-config.xml